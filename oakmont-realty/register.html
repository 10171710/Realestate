<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Create Account — Client Portal | Crestline Realty Group</title>
<meta name="description" content="Create a free Crestline Realty account to save your favorite homes, get real-time price drops, and book private property viewings.">
<meta name="theme-color" content="#18241f">
<link rel="canonical" href="https://www.crestline-realty.example/register.html">

<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%232f7d5d'/%3E%3Cpath d='M12 5l7 5.5v8h-4.5v-5h-5v5H5v-8L12 5z' fill='white'/%3E%3C/svg%3E">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.css" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'class',
    theme: {
      extend: {
        fontFamily: {
          sans: ['Manrope', 'ui-sans-serif', 'system-ui'],
          display: ['Fraunces', 'Georgia', 'serif']
        },
        colors: {
          brand: {
            50: '#eef7f0', 100: '#d9eee2', 200: '#b2dcc6', 300: '#82c3a3',
            400: '#5bb98f', 500: '#3d9c73', 600: '#2f7d5d', 700: '#256b4e',
            800: '#1f5740', 900: '#1a4634', 950: '#0f2b20'
          },
          ember: {
            50: '#fdf3ea', 100: '#f9e0cb', 200: '#f2c3a3', 300: '#e8a76f',
            400: '#d98a4f', 500: '#c96f4a', 600: '#b2542f', 700: '#93401f',
            800: '#6f3018', 900: '#4e2312'
          },
          ink: {
            50: '#f7f4f0', 100: '#ece6dd', 200: '#d8cdbd', 300: '#b8a993',
            400: '#94836d', 500: '#6e6050', 600: '#54483c', 700: '#3c342c',
            800: '#2b2622', 900: '#201c19'
          },
          cream: '#faf6f0',
          forest: { 800: '#18241f', 900: '#141b17', 950: '#101713' }
        },
        boxShadow: {
          soft: '0 10px 40px -12px rgba(47,125,93,0.35)',
          card: '0 2px 10px -2px rgba(32,28,25,0.08)',
          lift: '0 24px 50px -24px rgba(32,28,25,0.28)'
        },
        borderRadius: { '2xl': '1.25rem', '3xl': '1.75rem' }
      }
    }
  }
</script>

<script>
  (function () {
    var theme = localStorage.getItem('oak-theme') || 'light';
    var dir = localStorage.getItem('oak-dir') || 'ltr';
    document.documentElement.classList.toggle('dark', theme === 'dark');
    document.documentElement.setAttribute('dir', dir);
    document.documentElement.setAttribute('lang', dir === 'rtl' ? 'ar' : 'en');
  })();
</script>

<link rel="stylesheet" href="assets/css/style.css?v=2">
</head>
<body class="bg-cream dark:bg-forest-900 text-ink-700 dark:text-slate-300 antialiased min-h-screen flex flex-col justify-between relative overflow-x-hidden selection:bg-brand-500 selection:text-white">

  <!-- Ambient Glow Orbs -->
  <div class="fixed top-[-100px] start-[-100px] w-96 h-96 rounded-full bg-brand-500/15 dark:bg-brand-500/10 blur-3xl pointer-events-none"></div>
  <div class="fixed bottom-[-100px] end-[-100px] w-96 h-96 rounded-full bg-ember-500/15 dark:bg-ember-500/10 blur-3xl pointer-events-none"></div>

  <!-- Top bar controls -->
  <header class="w-full max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6 flex items-center justify-end relative z-10">
    <div class="flex items-center gap-2">
      <button id="dir-toggle" title="Toggle RTL / LTR Direction" aria-label="Toggle text direction" class="w-9 h-9 inline-flex items-center justify-center rounded-lg neu-icon text-ink-700 dark:text-slate-200 hover:bg-ink-100 dark:hover:bg-white/10 transition">
        <svg class="w-4 h-4 rtl-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 7H4M8 3.5L4 7l4 3.5" />
          <path d="M4 17h16M16 13.5l4 3.5-4 3.5" />
        </svg>
      </button>
      <button id="theme-toggle" title="Toggle dark / light mode" aria-label="Toggle dark or light mode" class="w-9 h-9 inline-flex items-center justify-center rounded-lg neu-icon text-ink-700 dark:text-slate-200 hover:bg-ink-100 dark:hover:bg-white/10 transition">
        <i class="ri-moon-line text-lg dark:hidden"></i>
        <i class="ri-sun-line text-lg hidden dark:inline"></i>
      </button>
    </div>
  </header>

  <!-- Main Register Card Section -->
  <main class="flex-1 flex items-center justify-center px-4 py-8 relative z-10">
    <div class="w-full max-w-lg" data-aos="fade-up">
      
      <!-- Register Container with custom rich background color -->
      <div class="rounded-3xl p-6 sm:p-8 shadow-2xl border border-white/15 bg-[#15231c] text-white relative backdrop-blur-xl">
        
        <!-- Centered Brand Logo & Header -->
        <div class="text-center mb-6">
          <a href="index.html" class="brand-logo inline-flex items-center justify-center gap-3 mb-3 group hover:opacity-90 transition">
            <span class="w-11 h-11 rounded-xl bg-white text-brand-700 flex items-center justify-center text-xl shadow-md shrink-0">
              <i class="ri-home-smile-fill"></i>
            </span>
            <span class="flex flex-col text-start">
              <span class="text-white text-2xl font-extrabold tracking-tight">Crest<span class="text-emerald-400">line</span></span>
              <span class="text-slate-300 text-[11px] font-bold uppercase tracking-wider">Realty Group</span>
            </span>
          </a>
          <h1 class="font-display text-2xl sm:text-3xl font-bold text-white">Create Client Account</h1>
          <p class="text-xs sm:text-sm text-slate-300 mt-1">Unlock saved homes, custom MLS filters &amp; direct tour booking.</p>
        </div>

        <!-- Form -->
        <form data-auth="register" class="space-y-4" novalidate>
          <input type="hidden" name="role" value="user">
          
          <div class="grid sm:grid-cols-2 gap-4">
            <div>
              <label for="reg-first" class="block text-xs font-bold text-slate-200 uppercase tracking-wider mb-1.5">First Name *</label>
              <input type="text" id="reg-first" name="first" placeholder="Jane" required minlength="2" pattern="[a-zA-Z\s'-]{2,}" title="First name must contain at least 2 letters" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-sm font-semibold text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:bg-white/15">
            </div>
            <div>
              <label for="reg-last" class="block text-xs font-bold text-slate-200 uppercase tracking-wider mb-1.5">Last Name *</label>
              <input type="text" id="reg-last" name="last" placeholder="Doe" required minlength="2" pattern="[a-zA-Z\s'-]{2,}" title="Last name must contain at least 2 letters" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-sm font-semibold text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:bg-white/15">
            </div>
          </div>

          <div>
            <label for="reg-email" class="block text-xs font-bold text-slate-200 uppercase tracking-wider mb-1.5">Email Address *</label>
            <input type="email" id="reg-email" name="email" placeholder="you@example.com" required pattern="[a-zA-Z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}" title="Email domain must be lowercase only (e.g. user@gmail.com)" class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-sm font-semibold text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:bg-white/15">
          </div>

          <div>
            <label for="reg-phone" class="block text-xs font-bold text-slate-200 uppercase tracking-wider mb-1.5">Phone Number (10 Digits) *</label>
            <input type="tel" id="reg-phone" name="phone" placeholder="(512) 555-0100" required class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-sm font-semibold text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:bg-white/15">
          </div>

          <div>
            <label for="reg-pass" class="block text-xs font-bold text-slate-200 uppercase tracking-wider mb-1.5">Password *</label>
            <input type="password" id="reg-pass" name="pass" placeholder="At least 6 characters" required class="w-full px-4 py-3 rounded-xl bg-white/10 border border-white/20 text-sm font-semibold text-white placeholder:text-slate-400 focus:outline-none focus:ring-2 focus:ring-emerald-400 focus:bg-white/15">
          </div>

          <div class="flex items-start gap-2 text-xs pt-1 text-slate-300">
            <input type="checkbox" id="reg-terms" required checked class="mt-0.5 w-4 h-4 rounded border-white/30 text-brand-600 focus:ring-emerald-400 bg-white/10">
            <label for="reg-terms">
              I agree to Crestline's <a href="terms.html" class="font-bold underline text-emerald-300">Terms of Service</a> &amp; <a href="privacy.html" class="font-bold underline text-emerald-300">Privacy Policy</a>.
            </label>
          </div>

          <button type="submit" class="w-full inline-flex items-center justify-center gap-2 px-6 py-3.5 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-sm shadow-soft transition">
            <i class="ri-user-follow-line"></i> Create Client Account
          </button>
        </form>

        <!-- Footnote Links -->
        <div class="mt-6 pt-5 border-t border-white/15 text-center space-y-2 text-xs text-slate-300">
          <p>
            Already have an account? <a href="login.html" class="font-bold text-emerald-300 hover:underline">Log in here</a>
          </p>
        </div>

      </div>

    </div>
  </main>



  <!-- Firebase Authentication SDK & Scripts -->
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.13.2/firebase-auth-compat.js"></script>
  <script src="assets/js/firebase-config.js"></script>
  <script src="assets/js/firebase-auth.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/aos@2.3.4/dist/aos.js"></script>
  <script src="assets/js/main.js?v=2"></script>
</body>
</html>
