              <span>Keep me signed in</span>

  <script>
    (function () {
      var forgot = document.getElementById("admin-forgot-link");
      if (forgot) {
        forgot.addEventListener("click", async function (e) {
          e.preventDefault();
          var emailInput = document.getElementById("admin-login-email");
          var email = emailInput ? emailInput.value.trim() : "";
          if (!email) {
            if (window.CrestlineToast) {
              window.CrestlineToast("Please type your work email first!", "error");
            }
            if (emailInput) emailInput.focus();
            return;
          }

          try {
            if (window.CrestlineAuth) {
              var res = await window.CrestlineAuth.sendPasswordReset(email);
              if (window.CrestlinePopup) {
                window.CrestlinePopup({
                  icon: '<i class="ri-mail-check-line text-ember-500 text-3xl"></i>',
                  title: "Staff Password Reset Dispatched",
                  message: res.message
                });
              }
            }
          } catch (err) {
            if (window.CrestlineToast) {
              window.CrestlineToast(err.message, "error");
            }
          }
        });
      }

      var googleBtn = document.getElementById("admin-google-login-btn");
      if (googleBtn) {
        googleBtn.addEventListener("click", async function () {
          try {
            if (window.CrestlineAuth) {
              if (window.CrestlineToast) window.CrestlineToast("Connecting to Google Workspace...", "info");
              var user = await window.CrestlineAuth.signInGoogle("admin");
              if (window.CrestlineToast) window.CrestlineToast("Welcome back, " + user.name + "!");
              setTimeout(function () {
                window.location.href = "admin-dashboard.html";
              }, 600);
            }
          } catch (err) {
            if (window.CrestlineToast) {
              window.CrestlineToast(err.message, "error");
            }
          }
        });
      }
    })();
  </script>
